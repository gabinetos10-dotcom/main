<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>three.js — scène de base</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0d12; overflow: hidden; }
    canvas { display: block; }
  </style>

  <!-- Chemins relatifs à ce fichier (libs/three/examples/). Adapter selon l'emplacement du site. -->
  <script type="importmap">
  {
    "imports": {
      "three": "../build/three.module.js",
      "three/addons/": "../jsm/"
    }
  }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(2.5, 2, 3.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // Lumières
    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
    const key = new THREE.DirectionalLight(0xffffff, 2);
    key.position.set(5, 8, 5);
    scene.add(key);

    // Cube
    const cube = new THREE.Mesh(
      new THREE.BoxGeometry(1.4, 1.4, 1.4),
      new THREE.MeshStandardMaterial({ color: 0x5b8def, roughness: 0.35, metalness: 0.1 })
    );
    scene.add(cube);

    // Sol
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(20, 20),
      new THREE.MeshStandardMaterial({ color: 0x121722, roughness: 1 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -1.2;
    scene.add(floor);

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    renderer.setAnimationLoop((t) => {
      cube.rotation.y = t / 2000;
      cube.rotation.x = t / 4000;
      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
