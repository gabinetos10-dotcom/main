<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>404 — Page introuvable | GJS</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#F5F8FF">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230B1533'/%3E%3Cg fill='%235B82FF' transform='translate(32 32)'%3E%3Crect x='-3' y='-19' width='6' height='38' rx='3'/%3E%3Crect x='-3' y='-19' width='6' height='38' rx='3' transform='rotate(60)'/%3E%3Crect x='-3' y='-19' width='6' height='38' rx='3' transform='rotate(120)'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="preconnect" href="https://api.fontshare.com">
  <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f%5B%5D=clash-display@500&f%5B%5D=satoshi@400,500&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400&family=Instrument+Serif:ital@1&display=swap">
  <link rel="stylesheet" href="style.css">
  <style>
    .e404 {
      min-height: 100svh; display: grid; align-content: center;
      position: relative; overflow: hidden; isolation: isolate; text-align: center;
      background: linear-gradient(180deg, var(--sky-50) 0%, var(--paper) 100%);
    }
    .e404 .blob--1 { top: -20vmax; }
    .e404 .blob--3 { bottom: -20vmax; }
    .e404__sky { position: absolute; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
    .e404__inner { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; }
    .e404__code {
      font-family: var(--font-display); font-weight: 500;
      font-size: clamp(6rem, 26vw, 20rem); line-height: .82;
      letter-spacing: -.06em;
      background: var(--grad-shine); background-size: 240% 100%;
      -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: shine 7s linear infinite;
    }
    .e404__title {
      font-family: var(--font-display); font-weight: 500;
      font-size: clamp(1.8rem, 5vw, 3.4rem);
      letter-spacing: var(--track-h); line-height: 1.05; margin-top: 1.6rem;
    }
    .e404__sub { color: var(--ink-soft); max-width: 40ch; margin-top: 1.2rem; }
    .e404__label { margin-bottom: 2rem; }
    .e404__actions { display: flex; gap: .8rem; flex-wrap: wrap; justify-content: center; margin-top: 2.6rem; }
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <main class="e404">
    <div class="e404__sky" aria-hidden="true">
      <span class="blob blob--1"></span>
      <span class="blob blob--2"></span>
      <span class="blob blob--3"></span>
    </div>

    <div class="container e404__inner">
      <p class="e404__label"><span class="mono-tag"><span class="live-dot"></span>Erreur — Page introuvable</span></p>
      <p class="e404__code">404</p>
      <h1 class="e404__title">Cette page s'est <em class="accent">envolée</em><span class="accent-dot">.</span></h1>
      <p class="e404__sub">Le lien est peut-être cassé, ou la page a été déplacée. <em class="serif-i">Rien de grave.</em></p>
      <div class="e404__actions">
        <a href="/" class="btn btn--primary"><span class="btn__text"><span class="btn__roll" data-text="Retour à l'accueil">Retour à l'accueil</span></span></a>
        <a href="/#contact" class="btn btn--ghost"><span class="btn__text"><span class="btn__roll" data-text="Nous écrire">Nous écrire</span></span></a>
      </div>
    </div>
  </main>
</body>
</html>
