<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Louis Pion — Boutique 360° (Maquette 3D)</title>
<style>
  :root { --midnight:#142a5c; --gold:#c9a45c; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; background:#eef1f5; font-family:"Helvetica Neue",Arial,sans-serif; }
  #app { position:fixed; inset:0; }
  canvas { display:block; }

  #brand {
    position:fixed; top:22px; left:28px; z-index:10;
    color:var(--midnight); letter-spacing:.32em; font-weight:300;
    font-size:20px; text-transform:uppercase; user-select:none;
    text-shadow:0 1px 6px rgba(255,255,255,.7);
  }
  #brand b { font-weight:700; color:var(--gold); }

  #hint {
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    z-index:10; color:#33415c; font-size:12px; letter-spacing:.12em;
    background:rgba(255,255,255,.7); border:1px solid rgba(20,42,92,.25);
    padding:9px 18px; border-radius:40px; backdrop-filter:blur(8px);
    user-select:none; text-transform:uppercase;
  }

  #nav { position:fixed; top:20px; right:24px; z-index:10; display:flex; flex-direction:column; gap:8px; }
  #nav button {
    background:rgba(255,255,255,.78); color:var(--midnight);
    border:1px solid rgba(20,42,92,.3); border-radius:8px;
    padding:9px 14px; font-size:11px; letter-spacing:.18em;
    cursor:pointer; text-transform:uppercase; backdrop-filter:blur(8px);
    transition:background .2s, border-color .2s;
  }
  #nav button:hover { background:rgba(201,164,92,.25); border-color:var(--gold); }

  #loader {
    position:fixed; inset:0; z-index:50; display:flex;
    align-items:center; justify-content:center; flex-direction:column;
    background:#f4f6fa; color:var(--midnight); letter-spacing:.3em;
    transition:opacity .8s ease; text-transform:uppercase; font-weight:300;
  }
  #loader.hide { opacity:0; pointer-events:none; }
  #loader b { color:var(--gold); font-weight:700; }
</style>
</head>
<body>
  <div id="loader"><div>LOUIS <b>PION</b></div></div>
  <div id="brand">LOUIS <b>PION</b></div>
  <div id="nav">
    <button data-view="overview">Vue d'ensemble</button>
    <button data-view="island">Îlot central</button>
    <button data-view="wall">Vitrines murales</button>
    <button data-view="entrance">Devanture / Accueil</button>
    <button data-view="kiosk">Borne avis</button>
    <button data-view="ceiling">Plafond</button>
  </div>
  <div id="hint">Glissez pour pivoter · molette pour zoomer · 360°</div>
  <div id="app"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  // ---------- Palette (bright, like the reference photos) ----------
  const MIDNIGHT   = 0x142a5c;  // deep midnight blue accents
  const MIDNIGHT2  = 0x1c3a78;
  const GOLD       = 0xc9a45c;
  const WOOD       = 0xc9a06a;
  const WHITE      = 0xf4f3ef;
  const FLOOR_COL  = 0xeceae4;  // light polished floor
  const WARM_WHITE = 0xfff6e6;
  const SCREEN_BLUE= 0x1d5be0;

  // ---------- Renderer ----------
  const renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  document.getElementById('app').appendChild(renderer.domElement);

  // ---------- Scene (bright) ----------
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xf1f3f7);

  const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 300);
  camera.position.set(12, 7, 13);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.minDistance = 1.5;
  controls.maxDistance = 30;
  controls.maxPolarAngle = Math.PI * 0.9;
  controls.target.set(0, 1.5, 0);

  // ===================================================================
  //  MATERIALS
  // ===================================================================
  const matWhite    = new THREE.MeshStandardMaterial({ color:WHITE, roughness:0.5, metalness:0.05 });
  const matFloor    = new THREE.MeshStandardMaterial({ color:FLOOR_COL, roughness:0.35, metalness:0.15 });
  const matMidnight = new THREE.MeshStandardMaterial({ color:MIDNIGHT, roughness:0.85, metalness:0.08 });
  const matMidnight2= new THREE.MeshStandardMaterial({ color:MIDNIGHT2, roughness:0.8, metalness:0.1 });
  const matGold     = new THREE.MeshStandardMaterial({ color:GOLD, roughness:0.3, metalness:1.0 });
  const matSilver   = new THREE.MeshStandardMaterial({ color:0xd8dce0, roughness:0.25, metalness:1.0 });
  const matWood     = new THREE.MeshStandardMaterial({ color:WOOD, roughness:0.7, metalness:0.05 });
  const matWall     = new THREE.MeshStandardMaterial({ color:0xf6f5f1, roughness:0.9, metalness:0.0, side:THREE.BackSide });
  const matGlass    = new THREE.MeshPhysicalMaterial({
    color:0xffffff, roughness:0.03, metalness:0,
    transmission:0.96, transparent:true, opacity:0.22,
    thickness:0.3, ior:1.45, reflectivity:0.35
  });
  const matShelfGlow= new THREE.MeshStandardMaterial({ color:0xffffff, emissive:WARM_WHITE, emissiveIntensity:0.9, roughness:0.5 });

  const ROOM_R = 14;
  const WALL_H = 7.5;

  // ===================================================================
  //  FLOOR — light polished + blue circular rug + gold inlay
  // ===================================================================
  const floor = new THREE.Mesh(new THREE.CircleGeometry(ROOM_R, 80), matFloor);
  floor.rotation.x = -Math.PI/2; floor.receiveShadow = true;
  scene.add(floor);

  const rug = new THREE.Mesh(new THREE.CircleGeometry(6, 64),
    new THREE.MeshStandardMaterial({ color:MIDNIGHT, roughness:1.0 }));
  rug.rotation.x = -Math.PI/2; rug.position.y = 0.012; rug.receiveShadow = true;
  scene.add(rug);

  const floorRing = new THREE.Mesh(new THREE.RingGeometry(6.0, 6.18, 80), matGold);
  floorRing.rotation.x = -Math.PI/2; floorRing.position.y = 0.02;
  scene.add(floorRing);

  // ===================================================================
  //  WALLS — light shell with midnight-blue panel sections
  // ===================================================================
  const wall = new THREE.Mesh(
    new THREE.CylinderGeometry(ROOM_R, ROOM_R, WALL_H, 80, 1, true), matWall);
  wall.position.y = WALL_H/2; wall.receiveShadow = true;
  scene.add(wall);

  // midnight-blue rectangular wall panels (the "bouts de mur" from the photos)
  const panelCount = 6;
  for (let i=0;i<panelCount;i++){
    const a = (i/panelCount)*Math.PI*2 + Math.PI/panelCount;
    const px = Math.sin(a)*(ROOM_R-0.12), pz = Math.cos(a)*(ROOM_R-0.12);
    const panel = new THREE.Mesh(new THREE.BoxGeometry(3.6, WALL_H-1.2, 0.18), matMidnight);
    panel.position.set(px, (WALL_H-1.2)/2, pz);
    panel.lookAt(0, (WALL_H-1.2)/2, 0);
    scene.add(panel);
    // subtle engraved gold lines accent
    for (let k=-1;k<=1;k++){
      const line = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.03, 0.02), matGold);
      line.position.set(px, 5.4 + k*0.18, pz); line.lookAt(0,5.4,0); line.translateZ(0.1);
      scene.add(line);
    }
  }

  // ===================================================================
  //  HANGING "LOUIS PION" SIGNS (blue box, white+gold lettering)
  // ===================================================================
  function makeLogoTexture(bg='#142a5c'){
    const c=document.createElement('canvas'); c.width=1024; c.height=256;
    const x=c.getContext('2d');
    x.fillStyle=bg; x.fillRect(0,0,c.width,c.height);
    x.font='700 120px "Helvetica Neue",Arial,sans-serif';
    x.textAlign='center'; x.textBaseline='middle';
    x.fillStyle='#ffffff'; x.fillText('LOUIS', 360, 128);
    x.fillStyle='#c9a45c'; x.fillText('PION', 690, 128);
    const t=new THREE.CanvasTexture(c); t.anisotropy=8; return t;
  }
  const logoTex = makeLogoTexture();
  const matSign = new THREE.MeshStandardMaterial({ map:logoTex, roughness:0.6, metalness:0.1,
    emissive:0xffffff, emissiveMap:logoTex, emissiveIntensity:0.25 });

  const signCount = 4;
  for (let i=0;i<signCount;i++){
    const a=(i/signCount)*Math.PI*2 + Math.PI/4;
    const px=Math.sin(a)*(ROOM_R-2.2), pz=Math.cos(a)*(ROOM_R-2.2);
    const grp=new THREE.Group();
    const box=new THREE.Mesh(new THREE.BoxGeometry(3.4,0.95,0.18), matSign);
    grp.add(box);
    // thin suspension rods
    [-1.4,1.4].forEach(dx=>{
      const rod=new THREE.Mesh(new THREE.CylinderGeometry(0.015,0.015,1.4,8), matSilver);
      rod.position.set(dx,0.9,0); grp.add(rod);
    });
    grp.position.set(px, WALL_H-1.4, pz);
    grp.lookAt(0, WALL_H-1.4, 0);
    scene.add(grp);
  }

  // ===================================================================
  //  WATCH helper (visible little watches everywhere)
  // ===================================================================
  function makeWatch(metal=matGold){
    const g=new THREE.Group();
    const body=new THREE.Mesh(new THREE.CylinderGeometry(0.13,0.13,0.05,28), metal);
    body.rotation.x=Math.PI/2; g.add(body);
    const face=new THREE.Mesh(new THREE.CylinderGeometry(0.105,0.105,0.052,28),
      new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.2 }));
    face.rotation.x=Math.PI/2; face.position.z=0.002; g.add(face);
    // hands
    const h1=new THREE.Mesh(new THREE.BoxGeometry(0.01,0.07,0.005), matMidnight);
    h1.position.z=0.03; g.add(h1);
    const h2=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.01,0.005), matMidnight);
    h2.position.z=0.03; g.add(h2);
    // strap hint
    const s1=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.12,0.04), metal);
    s1.position.y=0.14; g.add(s1);
    const s2=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.12,0.04), metal);
    s2.position.y=-0.14; g.add(s2);
    return g;
  }

  // ===================================================================
  //  WALL DISPLAY UNITS — warm wood + lit glass shelves with watches
  // ===================================================================
  const wallUnitCount = 6;
  for (let i=0;i<wallUnitCount;i++){
    const a=(i/wallUnitCount)*Math.PI*2;
    const px=Math.sin(a)*(ROOM_R-0.5), pz=Math.cos(a)*(ROOM_R-0.5);
    const g=new THREE.Group();

    // wood cabinet back
    const cab=new THREE.Mesh(new THREE.BoxGeometry(3.2,4.4,0.35), matWood);
    cab.position.y=2.6; g.add(cab);

    // 3 glowing glass shelves with watches
    for (let s=0;s<3;s++){
      const sy=1.6 + s*1.15;
      const shelf=new THREE.Mesh(new THREE.BoxGeometry(3.0,0.05,0.45), matShelfGlow);
      shelf.position.set(0,sy,0.22); g.add(shelf);
      for (let w=0;w<3;w++){
        const watch=makeWatch(w%2?matSilver:matGold);
        watch.scale.set(1.3,1.3,1.3);
        watch.position.set(-0.9+w*0.9, sy+0.28, 0.28);
        g.add(watch);
      }
    }
    // gold frame outline
    const frame=new THREE.Mesh(new THREE.BoxGeometry(3.3,4.5,0.05),
      new THREE.MeshStandardMaterial({ color:GOLD, roughness:0.35, metalness:1 }));
    frame.position.set(0,2.6,0.18); g.add(frame);
    const innerDark=new THREE.Mesh(new THREE.BoxGeometry(3.0,4.2,0.04),
      new THREE.MeshStandardMaterial({ color:0xf2f1ec }));
    frame.add(innerDark); innerDark.position.z=0.01;

    g.position.set(px,0,pz);
    g.lookAt(0,2.6,0);
    scene.add(g);

    // soft spot to light each unit
    const sp=new THREE.SpotLight(WARM_WHITE, 6, 9, Math.PI/6, 0.5, 1.3);
    sp.position.set(px*0.78, 6, pz*0.78);
    sp.target.position.set(px, 2.6, pz);
    scene.add(sp); scene.add(sp.target);
  }

  // ===================================================================
  //  DYNAMIC DIGITAL WALL SCREENS (brand visuals)
  // ===================================================================
  function makeAdTexture(){
    const c=document.createElement('canvas'); c.width=512; c.height=768;
    const x=c.getContext('2d');
    const grd=x.createLinearGradient(0,0,0,768);
    grd.addColorStop(0,'#1c3a78'); grd.addColorStop(1,'#0d1c40');
    x.fillStyle=grd; x.fillRect(0,0,512,768);
    x.fillStyle='#ffffff'; x.font='700 54px Arial'; x.textAlign='center';
    x.fillText('NOUVELLE', 256, 120); x.fillText('COLLECTION', 256, 185);
    // watch circle
    x.strokeStyle='#c9a45c'; x.lineWidth=10;
    x.beginPath(); x.arc(256,420,120,0,Math.PI*2); x.stroke();
    x.fillStyle='#c9a45c'; x.beginPath(); x.arc(256,420,12,0,Math.PI*2); x.fill();
    x.strokeStyle='#fff'; x.lineWidth=6;
    x.beginPath(); x.moveTo(256,420); x.lineTo(256,340); x.stroke();
    x.beginPath(); x.moveTo(256,420); x.lineTo(320,420); x.stroke();
    x.font='700 40px Arial'; x.fillStyle='#fff'; x.fillText('LOUIS', 210, 700);
    x.fillStyle='#c9a45c'; x.fillText('PION', 330, 700);
    return new THREE.CanvasTexture(c);
  }
  const adTex = makeAdTexture();
  const screenAngles=[Math.PI*0.5, Math.PI*1.5, Math.PI];
  const wallScreens=[];
  screenAngles.forEach(a=>{
    const px=Math.sin(a)*(ROOM_R-0.4), pz=Math.cos(a)*(ROOM_R-0.4);
    const screen=new THREE.Mesh(new THREE.PlaneGeometry(2.2,3.3),
      new THREE.MeshStandardMaterial({ map:adTex, emissive:0xffffff, emissiveMap:adTex, emissiveIntensity:0.85 }));
    screen.position.set(px,3.4,pz); screen.lookAt(0,3.4,0);
    scene.add(screen);
    const bez=new THREE.Mesh(new THREE.BoxGeometry(2.4,3.5,0.1), matMidnight);
    bez.position.set(px,3.4,pz); bez.lookAt(0,3.4,0); bez.translateZ(-0.06);
    scene.add(bez);
    wallScreens.push(screen);
  });

  // ===================================================================
  //  CENTRAL ROUND ISLAND — white counter, blue base, glass dome, tablets
  // ===================================================================
  const island=new THREE.Group();
  const counter=new THREE.Mesh(new THREE.CylinderGeometry(3,3.15,1.0,64), matWhite);
  counter.position.y=0.55; counter.castShadow=true; counter.receiveShadow=true; island.add(counter);
  const blueBand=new THREE.Mesh(new THREE.CylinderGeometry(3.05,3.2,0.5,64), matMidnight);
  blueBand.position.y=0.25; island.add(blueBand);
  const topRim=new THREE.Mesh(new THREE.TorusGeometry(3,0.05,12,64), matGold);
  topRim.rotation.x=Math.PI/2; topRim.position.y=1.05; island.add(topRim);

  // glass dome display on top with watches on stands
  const ped=new THREE.Mesh(new THREE.CylinderGeometry(1.3,1.4,0.18,48), matMidnight);
  ped.position.y=1.12; island.add(ped);
  const dome=new THREE.Mesh(new THREE.SphereGeometry(1.5,48,24,0,Math.PI*2,0,Math.PI/2), matGlass);
  dome.position.y=1.1; island.add(dome);
  const watchRing=new THREE.Group();
  for (let i=0;i<6;i++){
    const a=(i/6)*Math.PI*2;
    const stand=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.12,0.22,16), matWhite);
    stand.position.set(Math.cos(a)*0.75,1.32,Math.sin(a)*0.75); watchRing.add(stand);
    const wt=makeWatch(i%2?matSilver:matGold);
    wt.scale.set(1.4,1.4,1.4);
    wt.position.set(Math.cos(a)*0.75,1.55,Math.sin(a)*0.75);
    wt.rotation.y=-a; watchRing.add(wt);
  }
  island.add(watchRing);

  // embedded tablets (stock / réservation) on the rim
  function makeTabletTexture(label){
    const c=document.createElement('canvas'); c.width=256; c.height=170;
    const x=c.getContext('2d'); x.fillStyle='#0d2a66'; x.fillRect(0,0,256,170);
    x.fillStyle='#fff'; x.font='700 22px Arial'; x.textAlign='center';
    x.fillText(label,128,40);
    x.fillStyle='#1d5be0'; x.fillRect(28,70,200,16);
    x.fillStyle='#c9a45c'; x.fillRect(28,100,140,16);
    x.fillStyle='#3a6fe0'; x.fillRect(28,130,170,16);
    return new THREE.CanvasTexture(c);
  }
  ['STOCK','RÉSERVATION','CATALOGUE','CLIENT'].forEach((lab,i)=>{
    const a=(i/4)*Math.PI*2 + Math.PI/8;
    const tex=makeTabletTexture(lab);
    const tab=new THREE.Mesh(new THREE.BoxGeometry(0.62,0.42,0.03),
      new THREE.MeshStandardMaterial({ map:tex, emissive:0xffffff, emissiveMap:tex, emissiveIntensity:0.7 }));
    tab.position.set(Math.cos(a)*2.55,1.16,Math.sin(a)*2.55);
    tab.lookAt(Math.cos(a)*6,0.5,Math.sin(a)*6);
    island.add(tab);
  });
  scene.add(island);

  // ===================================================================
  //  FREESTANDING ROUND SHOWCASES (cylindrical glass capsules)
  // ===================================================================
  const showcases=[];
  const scCount=6;
  for (let i=0;i<scCount;i++){
    const a=(i/scCount)*Math.PI*2 + Math.PI/6;
    const px=Math.cos(a)*7.5, pz=Math.sin(a)*7.5;
    const g=new THREE.Group();
    const base=new THREE.Mesh(new THREE.CylinderGeometry(0.6,0.7,1.0,40), matWhite);
    base.position.y=0.5; base.castShadow=true; g.add(base);
    const blueFoot=new THREE.Mesh(new THREE.CylinderGeometry(0.65,0.72,0.25,40), matMidnight);
    blueFoot.position.y=0.12; g.add(blueFoot);
    const gr=new THREE.Mesh(new THREE.TorusGeometry(0.6,0.03,8,40), matGold);
    gr.rotation.x=Math.PI/2; gr.position.y=1.0; g.add(gr);
    const cyl=new THREE.Mesh(new THREE.CylinderGeometry(0.55,0.55,1.2,40,1,true), matGlass);
    cyl.position.y=1.65; g.add(cyl);
    const cap=new THREE.Mesh(new THREE.SphereGeometry(0.55,32,16,0,Math.PI*2,0,Math.PI/2), matGlass);
    cap.position.y=2.25; g.add(cap);
    const disc=new THREE.Mesh(new THREE.CylinderGeometry(0.34,0.34,0.06,32), matShelfGlow);
    disc.position.y=1.12; g.add(disc);
    const watch=makeWatch(i%2?matSilver:matGold);
    watch.scale.set(2.2,2.2,2.2);
    watch.position.y=1.55; watch.rotation.x=-0.5;
    g.add(watch);

    const sp=new THREE.SpotLight(WARM_WHITE, 8, 8, Math.PI/8, 0.4, 1.3);
    sp.position.set(px,5.5,pz); sp.target.position.set(px,1.4,pz); sp.castShadow=true;
    g.add(sp); g.add(sp.target);

    g.position.set(px,0,pz);
    scene.add(g);
    showcases.push({ disc, watch });
  }

  // ===================================================================
  //  DEVANTURE / ACCUEIL — welcome totem with digital screen
  // ===================================================================
  function makeWelcomeTexture(){
    const c=document.createElement('canvas'); c.width=420; c.height=760;
    const x=c.getContext('2d');
    const grd=x.createLinearGradient(0,0,0,760);
    grd.addColorStop(0,'#ffffff'); grd.addColorStop(1,'#e9eef8');
    x.fillStyle=grd; x.fillRect(0,0,420,760);
    x.fillStyle='#142a5c'; x.font='700 40px Arial'; x.textAlign='center';
    x.fillText('BIENVENUE', 210, 90); x.fillText('CHEZ', 210, 140);
    x.fillStyle='#c9a45c'; x.fillText('LOUIS PION', 210, 195);
    x.fillStyle='#142a5c'; x.font='24px Arial'; x.fillText('NOUVELLE COLLECTION', 210, 250);
    // watch graphic
    x.strokeStyle='#142a5c'; x.lineWidth=8;
    x.beginPath(); x.arc(210,430,95,0,Math.PI*2); x.stroke();
    x.strokeStyle='#c9a45c'; x.lineWidth=5;
    x.beginPath(); x.moveTo(210,430); x.lineTo(210,360); x.stroke();
    x.beginPath(); x.moveTo(210,430); x.lineTo(265,430); x.stroke();
    x.fillStyle='#142a5c'; x.font='700 30px Arial';
    x.fillText('LOUIS', 175, 700); x.fillStyle='#c9a45c'; x.fillText('PION', 280, 700);
    return new THREE.CanvasTexture(c);
  }
  const totem=new THREE.Group();
  const tBody=new THREE.Mesh(new THREE.BoxGeometry(1.1,2.6,0.18), matMidnight);
  tBody.position.y=1.6; totem.add(tBody);
  const tBase=new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.6,0.3,32), matWhite);
  tBase.position.y=0.15; totem.add(tBase);
  const wTex=makeWelcomeTexture();
  const tScreen=new THREE.Mesh(new THREE.PlaneGeometry(0.92,1.9),
    new THREE.MeshStandardMaterial({ map:wTex, emissive:0xffffff, emissiveMap:wTex, emissiveIntensity:0.8 }));
  tScreen.position.set(0,1.75,0.1); totem.add(tScreen);
  totem.position.set(Math.cos(Math.PI*1.15)*10.5,0,Math.sin(Math.PI*1.15)*10.5);
  totem.lookAt(0,1.75,0);
  scene.add(totem);

  // ===================================================================
  //  FEEDBACK KIOSK — discreet pedestal + rating screen with stars
  // ===================================================================
  const kiosk=new THREE.Group();
  const kStem=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.16,1.15,24), matSilver);
  kStem.position.y=0.57; kiosk.add(kStem);
  const kBase=new THREE.Mesh(new THREE.CylinderGeometry(0.34,0.34,0.06,32), matMidnight);
  kBase.position.y=0.03; kiosk.add(kBase);
  const cc=document.createElement('canvas'); cc.width=512; cc.height=320;
  const cx=cc.getContext('2d');
  cx.fillStyle='#ffffff'; cx.fillRect(0,0,512,320);
  cx.fillStyle='#142a5c'; cx.font='700 36px Arial'; cx.textAlign='center';
  cx.fillText('VOTRE AVIS COMPTE', 256, 75);
  cx.font='22px Arial'; cx.fillText('Donnez votre note', 256, 120);
  cx.fillStyle='#c9a45c'; cx.font='62px Arial'; cx.fillText('★ ★ ★ ★ ★', 256, 210);
  const kTex=new THREE.CanvasTexture(cc);
  const kScreen=new THREE.Mesh(new THREE.PlaneGeometry(0.72,0.45),
    new THREE.MeshStandardMaterial({ map:kTex, emissive:0xffffff, emissiveMap:kTex, emissiveIntensity:0.7 }));
  kScreen.position.y=1.3; kScreen.rotation.x=-0.35; kiosk.add(kScreen);
  kiosk.position.set(Math.cos(Math.PI*0.3)*11, 0, Math.sin(Math.PI*0.3)*11);
  kiosk.lookAt(0,1.3,0);
  scene.add(kiosk);

  // seller tablets on slim stands
  function makeStandTablet(angle, radius){
    const grp=new THREE.Group();
    const stem=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.06,1.1,16), matSilver);
    stem.position.y=0.55; grp.add(stem);
    const tex=makeTabletTexture('VENDEUR');
    const tab=new THREE.Mesh(new THREE.BoxGeometry(0.45,0.62,0.025),
      new THREE.MeshStandardMaterial({ map:tex, emissive:0xffffff, emissiveMap:tex, emissiveIntensity:0.7 }));
    tab.position.y=1.25; tab.rotation.x=-0.2; grp.add(tab);
    grp.position.set(Math.cos(angle)*5, 0, Math.sin(angle)*5);
    grp.lookAt(0,1.25,0); scene.add(grp);
  }
  makeStandTablet(Math.PI*0.75, 5);
  makeStandTablet(Math.PI*1.7, 5);

  // ===================================================================
  //  CEILING — light with luminous logo + LED rings
  // ===================================================================
  const ceiling=new THREE.Mesh(new THREE.CircleGeometry(ROOM_R,80),
    new THREE.MeshStandardMaterial({ color:0xf3f4f7, roughness:0.9, side:THREE.DoubleSide }));
  ceiling.rotation.x=Math.PI/2; ceiling.position.y=WALL_H; scene.add(ceiling);
  for (let r=2.5;r<=9;r+=2.2){
    const ring=new THREE.Mesh(new THREE.TorusGeometry(r,0.04,8,90),
      new THREE.MeshStandardMaterial({ color:0xffffff, emissive:0xbcd2ff, emissiveIntensity:1.6 }));
    ring.rotation.x=Math.PI/2; ring.position.y=WALL_H-0.05; scene.add(ring);
  }
  const ceilLogo=new THREE.Mesh(new THREE.PlaneGeometry(6,1.5),
    new THREE.MeshStandardMaterial({ map:makeLogoTexture('#ffffff'), transparent:true, opacity:0.85,
      emissive:0xffffff, emissiveIntensity:0.3, side:THREE.DoubleSide }));
  ceilLogo.rotation.x=Math.PI/2; ceilLogo.position.y=WALL_H-0.06; scene.add(ceilLogo);

  // ===================================================================
  //  LIGHTING — bright, airy, with accent glints
  // ===================================================================
  scene.add(new THREE.HemisphereLight(0xffffff, 0xdfe4ee, 1.1));
  scene.add(new THREE.AmbientLight(0xffffff, 0.45));

  const key=new THREE.DirectionalLight(0xffffff, 1.0);
  key.position.set(9,14,7); key.castShadow=true;
  key.shadow.mapSize.set(2048,2048);
  key.shadow.camera.near=1; key.shadow.camera.far=44;
  key.shadow.camera.left=-18; key.shadow.camera.right=18;
  key.shadow.camera.top=18; key.shadow.camera.bottom=-18;
  scene.add(key);

  const fill=new THREE.DirectionalLight(0xeaf0ff, 0.5);
  fill.position.set(-10,8,-6); scene.add(fill);

  // central hero spotlight
  const heroSpot=new THREE.SpotLight(WARM_WHITE, 18, 16, Math.PI/6, 0.4, 1.2);
  heroSpot.position.set(0,7,0); heroSpot.target.position.set(0,1,0); heroSpot.castShadow=true;
  scene.add(heroSpot); scene.add(heroSpot.target);

  // ===================================================================
  //  CAMERA PRESETS
  // ===================================================================
  const presets={
    overview:{ pos:[12,7,13], tgt:[0,1.4,0] },
    island:  { pos:[0,3,6.5], tgt:[0,1.3,0] },
    wall:    { pos:[0,3.2,3], tgt:[0,3,13] },
    entrance:{ pos:[-6,2.5,-6], tgt:[Math.cos(Math.PI*1.15)*10.5,1.6,Math.sin(Math.PI*1.15)*10.5] },
    kiosk:   { pos:[5,1.8,5], tgt:[Math.cos(Math.PI*0.3)*11,1.2,Math.sin(Math.PI*0.3)*11] },
    ceiling: { pos:[0,3,0.01], tgt:[0,7.4,0] }
  };
  let tween=null;
  function goTo(name){
    const p=presets[name]; if(!p) return;
    tween={ t:0, from:camera.position.clone(), to:new THREE.Vector3(...p.pos),
            fromT:controls.target.clone(), toT:new THREE.Vector3(...p.tgt) };
  }
  document.querySelectorAll('#nav button').forEach(b=>
    b.addEventListener('click', ()=>goTo(b.dataset.view)));

  // ===================================================================
  //  ANIMATION
  // ===================================================================
  const clock=new THREE.Clock();
  function animate(){
    requestAnimationFrame(animate);
    const dt=clock.getDelta(), t=clock.getElapsedTime();
    watchRing.rotation.y += dt*0.3;
    showcases.forEach((s,i)=>{
      s.disc.material.emissiveIntensity = 0.8 + Math.sin(t*1.4+i)*0.3;
      s.watch.rotation.y += dt*0.4;
    });
    wallScreens.forEach((sc,i)=>{ sc.material.emissiveIntensity = 0.75 + Math.sin(t*0.8+i*2)*0.2; });
    if (tween){
      tween.t=Math.min(1, tween.t+dt*1.4);
      const e=1-Math.pow(1-tween.t,3);
      camera.position.lerpVectors(tween.from, tween.to, e);
      controls.target.lerpVectors(tween.fromT, tween.toT, e);
      if (tween.t>=1) tween=null;
    }
    controls.update();
    renderer.render(scene,camera);
  }
  animate();

  addEventListener('load', ()=> setTimeout(()=>document.getElementById('loader').classList.add('hide'), 500));
  setTimeout(()=>document.getElementById('loader').classList.add('hide'), 1200);

  addEventListener('resize', ()=>{
    camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
  </script>
</body>
</html>
