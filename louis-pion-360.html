<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Louis Pion — Boutique 360° (Maquette 3D)</title>
<style>
  :root {
    --midnight: #0e1c3d;
    --gold: #c9a45c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #05070f; font-family: "Helvetica Neue", Arial, sans-serif; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  /* --- HUD / Overlay branding --- */
  #brand {
    position: fixed; top: 22px; left: 28px; z-index: 10;
    color: #fff; letter-spacing: 0.32em; font-weight: 300;
    font-size: 20px; text-transform: uppercase; user-select: none;
    text-shadow: 0 2px 14px rgba(0,0,0,.6);
  }
  #brand b { font-weight: 700; color: var(--gold); }

  #hint {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    z-index: 10; color: #cdd6ea; font-size: 12px; letter-spacing: .12em;
    background: rgba(14,28,61,.55); border: 1px solid rgba(201,164,92,.35);
    padding: 9px 18px; border-radius: 40px; backdrop-filter: blur(8px);
    user-select: none; text-transform: uppercase;
  }

  /* --- Camera preset buttons --- */
  #nav {
    position: fixed; top: 20px; right: 24px; z-index: 10;
    display: flex; flex-direction: column; gap: 8px;
  }
  #nav button {
    background: rgba(14,28,61,.6); color: #e7ecf7;
    border: 1px solid rgba(201,164,92,.4); border-radius: 8px;
    padding: 9px 14px; font-size: 11px; letter-spacing: .18em;
    cursor: pointer; text-transform: uppercase; backdrop-filter: blur(8px);
    transition: background .2s, border-color .2s;
  }
  #nav button:hover { background: rgba(201,164,92,.22); border-color: var(--gold); }

  #loader {
    position: fixed; inset: 0; z-index: 50; display: flex;
    align-items: center; justify-content: center; flex-direction: column;
    background: #05070f; color: #fff; letter-spacing: .3em;
    transition: opacity .8s ease; text-transform: uppercase; font-weight: 300;
  }
  #loader.hide { opacity: 0; pointer-events: none; }
  #loader b { color: var(--gold); font-weight: 700; }
</style>
</head>
<body>
  <div id="loader"><div>LOUIS <b>PION</b></div></div>
  <div id="brand">LOUIS <b>PION</b></div>
  <div id="nav">
    <button data-view="overview">Vue d'ensemble</button>
    <button data-view="island">Îlot central</button>
    <button data-view="wall">Vitrines murales</button>
    <button data-view="kiosk">Borne avis</button>
    <button data-view="ceiling">Plafond</button>
  </div>
  <div id="hint">Glissez pour pivoter · molette pour zoomer · 360°</div>
  <div id="app"></div>

  <!-- Three.js + OrbitControls via CDN (import map) -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  // ---------- Palette ----------
  const MIDNIGHT      = 0x0e1c3d;   // deep midnight blue (matte walls)
  const MIDNIGHT_DEEP = 0x081025;   // floor
  const GOLD          = 0xc9a45c;   // brushed warm metal
  const WARM_WHITE    = 0xfff4e0;   // showcase glow
  const COOL_LED      = 0xbcd2ff;   // LED line accent

  // ---------- Renderer ----------
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  document.getElementById('app').appendChild(renderer.domElement);

  // ---------- Scene & fog (gives the airy, deep "jewelry box" depth) ----------
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x070b16);
  scene.fog = new THREE.FogExp2(0x070b16, 0.018);

  // ---------- Camera ----------
  const camera = new THREE.PerspectiveCamera(58, innerWidth / innerHeight, 0.1, 200);
  camera.position.set(0, 4.2, 0.01); // start near center looking out — true 360° anchor

  // ---------- Controls (360° drag / touch) ----------
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.minDistance = 0.5;
  controls.maxDistance = 26;
  controls.maxPolarAngle = Math.PI * 0.92;
  controls.target.set(0, 1.6, 0);

  // ===================================================================
  //  MATERIALS
  // ===================================================================
  const matMidnightWall = new THREE.MeshStandardMaterial({
    color: MIDNIGHT, roughness: 0.95, metalness: 0.05
  });
  const matFloor = new THREE.MeshStandardMaterial({
    color: MIDNIGHT_DEEP, roughness: 0.25, metalness: 0.6
  });
  const matGold = new THREE.MeshStandardMaterial({
    color: GOLD, roughness: 0.3, metalness: 1.0
  });
  const matWhite = new THREE.MeshStandardMaterial({
    color: 0xf3f2ee, roughness: 0.6, metalness: 0.1
  });
  const matGlass = new THREE.MeshPhysicalMaterial({
    color: 0xffffff, roughness: 0.02, metalness: 0,
    transmission: 0.95, transparent: true, opacity: 0.3,
    thickness: 0.4, ior: 1.45, reflectivity: 0.4
  });
  const matGlow = new THREE.MeshStandardMaterial({
    color: WARM_WHITE, emissive: WARM_WHITE, emissiveIntensity: 1.4
  });
  const matLED = new THREE.MeshStandardMaterial({
    color: COOL_LED, emissive: COOL_LED, emissiveIntensity: 2.0
  });
  const matScreen = new THREE.MeshStandardMaterial({
    color: 0x0d49b8, emissive: 0x123e8f, emissiveIntensity: 0.9,
    roughness: 0.3, metalness: 0.2
  });

  const ROOM_R = 13;      // circular room radius
  const WALL_H = 7;       // wall height

  // ===================================================================
  //  FLOOR — midnight blue, polished, with a gold inlay ring
  // ===================================================================
  const floor = new THREE.Mesh(new THREE.CircleGeometry(ROOM_R, 80), matFloor);
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);

  // central round rug (deep blue) marking the hospitality zone
  const rug = new THREE.Mesh(new THREE.CircleGeometry(5.2, 64),
    new THREE.MeshStandardMaterial({ color: 0x12245a, roughness: 1.0 }));
  rug.rotation.x = -Math.PI / 2; rug.position.y = 0.01; rug.receiveShadow = true;
  scene.add(rug);

  // gold inlay ring in the floor
  const floorRing = new THREE.Mesh(new THREE.RingGeometry(7.4, 7.55, 80), matGold);
  floorRing.rotation.x = -Math.PI / 2; floorRing.position.y = 0.02;
  scene.add(floorRing);

  // ===================================================================
  //  WALLS — cylindrical midnight shell with engraved logo bands
  // ===================================================================
  const wall = new THREE.Mesh(
    new THREE.CylinderGeometry(ROOM_R, ROOM_R, WALL_H, 80, 1, true),
    new THREE.MeshStandardMaterial({ color: MIDNIGHT, roughness: 0.95, side: THREE.BackSide })
  );
  wall.position.y = WALL_H / 2;
  wall.receiveShadow = true;
  scene.add(wall);

  // ----- "LOUIS PION" logo signs on the wall (canvas texture), repeated around -----
  function makeLogoTexture() {
    const c = document.createElement('canvas');
    c.width = 1024; c.height = 256;
    const x = c.getContext('2d');
    x.fillStyle = '#0e1c3d'; x.fillRect(0, 0, c.width, c.height);
    x.font = '700 120px "Helvetica Neue", Arial, sans-serif';
    x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillStyle = '#ffffff'; x.fillText('LOUIS', 360, 128);
    x.fillStyle = '#c9a45c'; x.fillText('PION', 690, 128);
    // thin underline accents
    x.strokeStyle = '#c9a45c'; x.lineWidth = 4;
    x.beginPath(); x.moveTo(120, 200); x.lineTo(904, 200); x.stroke();
    const t = new THREE.CanvasTexture(c);
    t.anisotropy = 8;
    return t;
  }
  const logoTex = makeLogoTexture();
  const matLogoSign = new THREE.MeshStandardMaterial({
    map: logoTex, emissive: 0xffffff, emissiveMap: logoTex,
    emissiveIntensity: 0.35, roughness: 0.6
  });

  const signCount = 4;
  for (let i = 0; i < signCount; i++) {
    const a = (i / signCount) * Math.PI * 2 + Math.PI / 4;
    const sign = new THREE.Mesh(new THREE.PlaneGeometry(4.5, 1.12), matLogoSign);
    sign.position.set(Math.sin(a) * (ROOM_R - 0.15), 5.2, Math.cos(a) * (ROOM_R - 0.15));
    sign.lookAt(0, 5.2, 0);
    scene.add(sign);
  }

  // ===================================================================
  //  WALL SHOWCASES — recessed lit niches + big dynamic screens
  // ===================================================================
  const nicheCount = 10;
  for (let i = 0; i < nicheCount; i++) {
    const a = (i / nicheCount) * Math.PI * 2;
    const px = Math.sin(a) * (ROOM_R - 0.5);
    const pz = Math.cos(a) * (ROOM_R - 0.5);

    // lit niche box
    const niche = new THREE.Mesh(new THREE.BoxGeometry(1.9, 2.6, 0.5), matGlow);
    niche.material = new THREE.MeshStandardMaterial({
      color: 0x1a2c55, emissive: WARM_WHITE, emissiveIntensity: 0.5, roughness: 0.4
    });
    niche.position.set(px, 3.0, pz);
    niche.lookAt(0, 3.0, 0);
    scene.add(niche);

    // gold frame
    const frame = new THREE.Mesh(new THREE.TorusGeometry(1.0, 0.04, 8, 32), matGold);
    frame.position.copy(niche.position);
    frame.lookAt(0, 3.0, 0);
    scene.add(frame);

    // floating watch "puck" inside niche
    const puck = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.32, 0.1, 32), matGold);
    puck.rotation.x = Math.PI / 2;
    puck.position.set(px * 0.97, 3.0, pz * 0.97);
    puck.lookAt(0, 3.0, 0);
    scene.add(puck);

    // small spotlight per niche -> "jewelry box" glints
    const sp = new THREE.SpotLight(WARM_WHITE, 8, 6, Math.PI / 7, 0.5, 1.5);
    sp.position.set(px * 0.8, 4.6, pz * 0.8);
    sp.target.position.set(px, 2.6, pz);
    scene.add(sp); scene.add(sp.target);
  }

  // Two large dynamic wall screens (storytelling / mechanism animations)
  const screenAngles = [Math.PI * 0.5, Math.PI * 1.5];
  const wallScreens = [];
  screenAngles.forEach(a => {
    const px = Math.sin(a) * (ROOM_R - 0.45);
    const pz = Math.cos(a) * (ROOM_R - 0.45);
    const screen = new THREE.Mesh(new THREE.PlaneGeometry(3.6, 2.0), matScreen.clone());
    screen.position.set(px, 3.4, pz);
    screen.lookAt(0, 3.4, 0);
    scene.add(screen);
    // gold bezel
    const bez = new THREE.Mesh(new THREE.BoxGeometry(3.8, 2.2, 0.08), matGold);
    bez.position.set(px, 3.4, pz); bez.lookAt(0, 3.4, 0); bez.translateZ(-0.04);
    scene.add(bez);
    wallScreens.push(screen);
  });

  // ===================================================================
  //  CEILING — luminous logo watermark + concentric LED rings
  // ===================================================================
  const ceiling = new THREE.Mesh(new THREE.CircleGeometry(ROOM_R, 80),
    new THREE.MeshStandardMaterial({ color: 0x0a1530, roughness: 0.9, side: THREE.DoubleSide }));
  ceiling.rotation.x = Math.PI / 2; ceiling.position.y = WALL_H;
  scene.add(ceiling);

  // concentric glowing LED rings
  for (let r = 2; r <= 9; r += 2.2) {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(r, 0.03, 8, 90), matLED);
    ring.rotation.x = Math.PI / 2; ring.position.y = WALL_H - 0.05;
    scene.add(ring);
  }

  // luminous logo watermark on ceiling
  const ceilLogo = new THREE.Mesh(new THREE.PlaneGeometry(6, 1.5),
    new THREE.MeshStandardMaterial({
      map: logoTex, transparent: true, opacity: 0.5,
      emissive: 0xffffff, emissiveMap: logoTex, emissiveIntensity: 0.6, side: THREE.DoubleSide
    }));
  ceilLogo.rotation.x = Math.PI / 2; ceilLogo.position.y = WALL_H - 0.06;
  scene.add(ceilLogo);

  // ===================================================================
  //  CENTRAL ROUND ISLAND — hospitality hub with embedded tablets
  // ===================================================================
  const islandGroup = new THREE.Group();

  // base counter (white) + midnight skirt
  const counter = new THREE.Mesh(new THREE.CylinderGeometry(3, 3.2, 1.05, 64), matWhite);
  counter.position.y = 0.52; counter.castShadow = true; counter.receiveShadow = true;
  islandGroup.add(counter);

  const skirt = new THREE.Mesh(new THREE.CylinderGeometry(3.05, 3.25, 0.45, 64), matMidnightWall);
  skirt.position.y = 0.22; islandGroup.add(skirt);

  // gold top rim
  const rim = new THREE.Mesh(new THREE.TorusGeometry(3, 0.05, 12, 64), matGold);
  rim.rotation.x = Math.PI / 2; rim.position.y = 1.05; islandGroup.add(rim);

  // LED under-glow ring beneath the island (floating effect)
  const underGlow = new THREE.Mesh(new THREE.TorusGeometry(3.15, 0.06, 8, 64), matLED);
  underGlow.rotation.x = Math.PI / 2; underGlow.position.y = 0.04; islandGroup.add(underGlow);

  // inner domed glass display capsule on top of the island
  const dome = new THREE.Mesh(new THREE.SphereGeometry(1.4, 48, 24, 0, Math.PI * 2, 0, Math.PI / 2), matGlass);
  dome.position.y = 1.05; islandGroup.add(dome);
  // pedestal + watches under the dome
  const ped = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.3, 0.15, 48), matMidnightWall);
  ped.position.y = 1.08; islandGroup.add(ped);
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2;
    const w = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.06, 24), matGold);
    w.position.set(Math.cos(a) * 0.7, 1.2, Math.sin(a) * 0.7);
    islandGroup.add(w);
  }

  // embedded tablets (stock / booking) around the island rim — angled screens
  const tablets = [];
  for (let i = 0; i < 4; i++) {
    const a = (i / 4) * Math.PI * 2 + Math.PI / 8;
    const tab = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.45, 0.03),
      new THREE.MeshStandardMaterial({ color: 0x0d49b8, emissive: 0x1d5be0, emissiveIntensity: 0.8 }));
    tab.position.set(Math.cos(a) * 2.6, 1.18, Math.sin(a) * 2.6);
    tab.lookAt(Math.cos(a) * 6, 0.4, Math.sin(a) * 6);
    islandGroup.add(tab);
    tablets.push(tab);
  }

  scene.add(islandGroup);

  // ===================================================================
  //  FREESTANDING ROUND SHOWCASES — cylindrical capsules around island
  // ===================================================================
  const showcases = [];
  const scCount = 6;
  for (let i = 0; i < scCount; i++) {
    const a = (i / scCount) * Math.PI * 2 + Math.PI / 6;
    const px = Math.cos(a) * 6.5;
    const pz = Math.sin(a) * 6.5;
    const g = new THREE.Group();

    // midnight base
    const base = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.65, 1.0, 40), matMidnightWall);
    base.position.y = 0.5; base.castShadow = true; g.add(base);
    // gold ring
    const gr = new THREE.Mesh(new THREE.TorusGeometry(0.55, 0.03, 8, 40), matGold);
    gr.rotation.x = Math.PI / 2; gr.position.y = 1.0; g.add(gr);
    // glass cylinder
    const cyl = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 1.1, 40, 1, true), matGlass);
    cyl.position.y = 1.6; g.add(cyl);
    // domed glass top
    const cap = new THREE.Mesh(new THREE.SphereGeometry(0.5, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2), matGlass);
    cap.position.y = 2.15; g.add(cap);
    // glowing display puck + watch
    const disc = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.05, 32), matGlow);
    disc.position.y = 1.12; g.add(disc);
    const watch = new THREE.Mesh(new THREE.TorusGeometry(0.16, 0.05, 12, 24), matGold);
    watch.position.y = 1.35; watch.rotation.x = Math.PI / 2.2; g.add(watch);

    // dedicated spotlight from above (the glint)
    const sp = new THREE.SpotLight(WARM_WHITE, 10, 8, Math.PI / 8, 0.4, 1.4);
    sp.position.set(px, 5, pz);
    sp.target.position.set(px, 1.2, pz);
    sp.castShadow = true;
    g.add(sp); g.add(sp.target);

    g.position.set(px, 0, pz);
    scene.add(g);
    showcases.push({ group: g, disc });
  }

  // ===================================================================
  //  FEEDBACK KIOSK (near "exit") — discreet pedestal + rating screen
  // ===================================================================
  const kiosk = new THREE.Group();
  const kStem = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.18, 1.1, 24), matGold);
  kStem.position.y = 0.55; kiosk.add(kStem);
  const kBase = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 0.06, 32), matMidnightWall);
  kBase.position.y = 0.03; kiosk.add(kBase);
  // angled rating screen with stars (canvas)
  const cc = document.createElement('canvas'); cc.width = 512; cc.height = 320;
  const cx = cc.getContext('2d');
  cx.fillStyle = '#0e1c3d'; cx.fillRect(0,0,512,320);
  cx.fillStyle = '#fff'; cx.font = '700 34px Arial'; cx.textAlign = 'center';
  cx.fillText('VOTRE AVIS COMPTE', 256, 80);
  cx.fillStyle = '#c9a45c'; cx.font = '60px Arial';
  cx.fillText('★ ★ ★ ★ ★', 256, 190);
  const kTex = new THREE.CanvasTexture(cc);
  const kScreen = new THREE.Mesh(new THREE.PlaneGeometry(0.7, 0.44),
    new THREE.MeshStandardMaterial({ map: kTex, emissive: 0xffffff, emissiveMap: kTex, emissiveIntensity: 0.5 }));
  kScreen.position.y = 1.25; kScreen.rotation.x = -0.35; kiosk.add(kScreen);
  kiosk.position.set(Math.cos(Math.PI*0.25)*10, 0, Math.sin(Math.PI*0.25)*10);
  kiosk.lookAt(0, 1.25, 0);
  scene.add(kiosk);

  // a couple of seller tablets on slim stands flanking the island
  function makeStandTablet(angle, radius) {
    const grp = new THREE.Group();
    const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.06,1.1,16), matGold);
    stem.position.y = 0.55; grp.add(stem);
    const tab = new THREE.Mesh(new THREE.BoxGeometry(0.45,0.62,0.025),
      new THREE.MeshStandardMaterial({ color:0x0d49b8, emissive:0x1d5be0, emissiveIntensity:0.7 }));
    tab.position.y = 1.25; tab.rotation.x = -0.2; grp.add(tab);
    grp.position.set(Math.cos(angle)*radius, 0, Math.sin(angle)*radius);
    grp.lookAt(0,1.25,0);
    scene.add(grp);
  }
  makeStandTablet(Math.PI*0.9, 4.5);
  makeStandTablet(Math.PI*1.6, 4.5);

  // ===================================================================
  //  LIGHTING — ambient + directional + accent spots
  // ===================================================================
  scene.add(new THREE.AmbientLight(0x3a4a78, 0.6)); // cool blue fill keeps midnight rich

  const key = new THREE.DirectionalLight(0xffffff, 0.7);
  key.position.set(8, 12, 6);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.camera.near = 1; key.shadow.camera.far = 40;
  key.shadow.camera.left = -16; key.shadow.camera.right = 16;
  key.shadow.camera.top = 16; key.shadow.camera.bottom = -16;
  scene.add(key);

  // warm gold rim from the gold inlay direction
  const warm = new THREE.PointLight(GOLD, 0.6, 30);
  warm.position.set(0, 6, 0);
  scene.add(warm);

  // central island hero spotlight (the showpiece)
  const heroSpot = new THREE.SpotLight(WARM_WHITE, 30, 14, Math.PI / 6, 0.4, 1.2);
  heroSpot.position.set(0, 6.5, 0);
  heroSpot.target.position.set(0, 1, 0);
  heroSpot.castShadow = true;
  scene.add(heroSpot); scene.add(heroSpot.target);

  // ===================================================================
  //  CAMERA PRESETS
  // ===================================================================
  const presets = {
    overview: { pos: [11, 6.5, 11], tgt: [0, 1.4, 0] },
    island:   { pos: [0, 3.2, 6],   tgt: [0, 1.2, 0] },
    wall:     { pos: [0, 3.4, 2],    tgt: [0, 3.4, 12] },
    kiosk:    { pos: [5, 1.8, 5],    tgt: [7, 1.2, 7] },
    ceiling:  { pos: [0, 3, 0.01],   tgt: [0, 7, 0] }
  };
  let tween = null;
  function goTo(name) {
    const p = presets[name]; if (!p) return;
    tween = {
      t: 0,
      from: camera.position.clone(),
      to: new THREE.Vector3(...p.pos),
      fromT: controls.target.clone(),
      toT: new THREE.Vector3(...p.tgt)
    };
  }
  document.querySelectorAll('#nav button').forEach(b =>
    b.addEventListener('click', () => goTo(b.dataset.view)));

  // ===================================================================
  //  ANIMATION LOOP
  // ===================================================================
  const clock = new THREE.Clock();
  function animate() {
    requestAnimationFrame(animate);
    const dt = clock.getDelta();
    const t = clock.getElapsedTime();

    // gentle rotation of central watch pedestal
    ped.rotation.y += dt * 0.25;

    // pulsing showcase glow (subtle "breathing" light)
    showcases.forEach((s, i) => {
      s.disc.material.emissiveIntensity = 1.0 + Math.sin(t * 1.5 + i) * 0.4;
    });

    // animate wall screens hue (dynamic storytelling feel)
    wallScreens.forEach((sc, i) => {
      sc.material.emissiveIntensity = 0.7 + Math.sin(t * 0.8 + i * 2) * 0.3;
    });

    // smooth camera tween to presets
    if (tween) {
      tween.t = Math.min(1, tween.t + dt * 1.4);
      const e = 1 - Math.pow(1 - tween.t, 3); // ease-out cubic
      camera.position.lerpVectors(tween.from, tween.to, e);
      controls.target.lerpVectors(tween.fromT, tween.toT, e);
      if (tween.t >= 1) tween = null;
    }

    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  // intro: start at center, then ease to an overview
  setTimeout(() => goTo('overview'), 400);

  // hide loader
  addEventListener('load', () => {
    setTimeout(() => document.getElementById('loader').classList.add('hide'), 500);
  });
  // also hide shortly after module runs (in case load already fired)
  setTimeout(() => document.getElementById('loader').classList.add('hide'), 1200);

  // ---------- Resize ----------
  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
  </script>
</body>
</html>
